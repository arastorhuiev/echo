packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# pnpm 11 blocks postinstall scripts unless explicitly trusted.
# Audit what each package's postinstall does before adding it here.
allowBuilds:
  # Just prints sponsorship banner.
  "@nestjs/core": true
  # esbuild's postinstall fetches the platform-specific binary it needs to run.
  # Required by drizzle-kit (config loader) and tsx (TS transpiler).
  esbuild: true
  # protobufjs precompiles its parser; pulled in transitively by testcontainers.
  protobufjs: true
  # ssh2 + cpu-features are native bindings used by testcontainers' SSH transport.
  ssh2: true
  cpu-features: true
  # @scarf/scarf is a telemetry tracker some packages bundle. We don't run it.
  "@scarf/scarf": false
  # msgpackr-extract is the native msgpack codec used by BullMQ for fast
  # job (de)serialisation. The postinstall builds prebuilt binaries.
  msgpackr-extract: true
  # simple-git-hooks postinstall installs the .git/hooks/pre-commit shim
  # from package.json's "simple-git-hooks" block. Without this it falls
  # back to a manual `pnpm exec simple-git-hooks` step.
  simple-git-hooks: true
  # sharp ships per-platform native binaries; Astro pulls it in via its
  # image-optim pipeline. Postinstall just downloads the prebuilt
  # binary for the current arch.
  sharp: true
