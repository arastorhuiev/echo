  #     NODE_ENV: ${NODE_ENV:-development}
  #     APP_ROLE: worker
  #     DATABASE_URL: ${DATABASE_URL:-postgres://echo:changeme@postgres:5432/echo}
  #     REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  #   depends_on:
  #     postgres: { condition: service_healthy }
