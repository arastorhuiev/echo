name: echo

services:
  postgres:
    image: postgres:17-alpine
    container_name: echo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-echo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echo} -d ${POSTGRES_DB:-echo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: echo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api
    container_name: echo-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgres://echo:changeme@postgres:5432/echo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OSINT_PY_URL: ${OSINT_PY_URL:-http://osint-py:8000}
      OTEL_SERVICE_NAME: echo-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osint-py:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health/live > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: worker
    container_name: echo-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://echo:changeme@postgres:5432/echo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OSINT_PY_URL: ${OSINT_PY_URL:-http://osint-py:8000}
      OTEL_SERVICE_NAME: echo-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osint-py:
        condition: service_healthy

  osint-py:
    build:
      context: ./services/echo-osint-py
      dockerfile: Dockerfile
    container_name: echo-osint-py
    restart: unless-stopped
    # OSINT provider credentials live in `.env.providers` (optional, git-ignored)
    # so the whole credential layer is one deletable unit. `required: false`
    # means an absent file is fine — env-conditional providers just report
    # `configured=false`. Infrastructure config stays in `.env` / this file.
    env_file:
      - path: ./.env.providers
        required: false
    environment:
      # Outbound proxy wiring — empty by default → sidecar goes direct.
      # When the "proxy" profile is active AND HTTPS_PROXY is set in .env,
      # Python's requests/httpx pick this up automatically. The sidecar
      # itself contains zero proxy-aware code. See infra/proxy-gw/README.md.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    volumes:
      # File-based provider credentials (Telegram session, GHunt creds.m, …)
      # live in the git-ignored ./secrets dir. ONE mount covers every
      # file-based credential — point the matching *_PATH env at /secrets/…
      # in .env.providers. Read-write because Telethon updates its session
      # SQLite on every connect. The session itself is minted once via
      #   docker compose run --rm osint-py python -m app.telegram_login
      # and is portable: copy ./secrets to another host to redeploy.
      - ./secrets:/secrets
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # Optional infra — disabled by default via compose profiles.
  # ─────────────────────────────────────────────────────────────

  # Outbound forward proxy for scrape-based OSINT providers (Sherlock, Maigret, …).
  # OPTIONAL — disabled by default. Activates with: docker compose --profile proxy up
  # Wholly decoupled from app code: the only contact point is the sidecar's
  # HTTPS_PROXY env var, which defaults to empty. See infra/proxy-gw/README.md
  # for the architectural contract and the "how to delete cleanly" checklist.
  proxy-gw:
    image: vimagick/tinyproxy:latest
    container_name: echo-proxy-gw
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./infra/proxy-gw/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
    # No depends_on and no other service depends_on us — the seam stays clean.

  # ─────────────────────────────────────────────────────────────
  # Commented out for now — activated by later phases.
  # ─────────────────────────────────────────────────────────────

  # caddy — production reverse proxy with TLS.
  # Not used locally; activated when P11 (deployment) is unfrozen.

volumes:
  postgres-data:
  redis-data:
