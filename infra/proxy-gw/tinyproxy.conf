# ─────────────────────────────────────────────────────────────
# echo proxy-gw — tinyproxy forward HTTP/HTTPS proxy
# ─────────────────────────────────────────────────────────────
# Mounted read-only into the proxy-gw container by docker-compose.yml.
# Default mode is PASS-THROUGH (no upstream). See README.md in this
# directory for the architectural contract and how to remove cleanly.
# See RUNBOOK.md → "Proxy gateway" for guided upstream-provider setup.

User tinyproxy
Group tinyproxy

# Listen on all interfaces inside the container; the docker network is the
# only thing that can reach us (no ports are published in docker-compose).
Port 8080
Listen 0.0.0.0

# Per-request timeout (seconds). Sherlock/Maigret runs are long-lived
# streams from the sidecar's perspective; the timeout here is per upstream
# socket, not per full lookup.
Timeout 600

LogLevel Info
# /tmp is the only path guaranteed writable by the unprivileged `tinyproxy`
# user across every distribution of the image. /var/run/tinyproxy doesn't
# exist in the vimagick/tinyproxy image and the daemon refuses to start.
PidFile "/tmp/tinyproxy.pid"
MaxClients 100

# Access control — only accept connections from the docker compose network.
# These three CIDRs cover every default docker network range; tighten if
# you've explicitly configured a non-default subnet.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# CONNECT method (HTTPS tunneling). Restrict to the standard TLS ports so
# we're not accidentally tunneling arbitrary TCP.
ConnectPort 443
ConnectPort 563

# ─────────────────────────────────────────────────────────────
# Upstream proxy — DEFAULT IS PASS-THROUGH (no upstream).
#
# To route outbound traffic through a paid residential provider, uncomment
# ONE of the templates below and replace the placeholder with your real
# endpoint + credentials. Restart the container:
#
#     docker compose --profile proxy restart proxy-gw
#
# See RUNBOOK.md → "Proxy gateway" for the 5-minute walkthrough.
# ─────────────────────────────────────────────────────────────

# (1) Single upstream provider — typical first step.
#     Format: upstream http <user>:<pass>@<host>:<port>
#
# upstream http USER:PASS@gate.smartproxy.com:7000

# (2) Multiple upstream providers — tinyproxy round-robins between them.
#
# upstream http USER1:PASS1@gate.provider-a.com:7000
# upstream http USER2:PASS2@gate.provider-b.com:7000

# (3) Per-host bypass — combine with (1) or (2) to skip the upstream proxy
#     for low-risk hosts (saves $ on metered residential traffic).
#
# upstream none "github.com"
# upstream none "api.github.com"
# upstream none "news.ycombinator.com"
