[project]
name = "echo-osint-py"
version = "0.0.0"
description = "Python OSINT sidecar — hosts Python-only providers (Sherlock, …) for echo."
requires-python = ">=3.13"
dependencies = [
    # FastAPI 0.118+ ships native StreamingResponse cancellation behaviour
    # used by the SSE endpoints; pinned conservatively.
    "fastapi==0.118.2",
    "uvicorn[standard]==0.32.1",
    # Sherlock is a CLI; we invoke it as `python -u -m sherlock_project`.
    # Pinned because the site list rotates fast — bump deliberately.
    "sherlock-project==0.15.0",
    # Held at 0.27.2 because ghunt 2.3.3 pins httpx>=0.27.2,<0.28.0;
    # our own runners only use basic AsyncClient/get/post which are
    # stable across the 0.27 line.
    "httpx==0.27.2",
    "pydantic==2.10.4",
    # libphonenumber Python port (David Drysdale, Apache-2.0). Used
    # in-process by phonenumbers_runner; no subprocess.
    "phonenumbers==9.0.7",
    # Maigret — username scanner with ~3k site corpus (superset of
    # Sherlock). Invoked as `python -u -m maigret`, NDJSON streaming.
    "maigret==0.6.1",
    # socialscan — availability check ("can I register `jdoe` here?")
    # across ~10 platforms. CLI invocation, writes JSON to a temp file
    # we slurp after exit; no native streaming.
    "socialscan==2.0.1",
    # Telethon — MTProto client. Used only when TELEGRAM_API_ID/_HASH/
    # _SESSION_PATH env vars are present. Hosted on Codeberg upstream
    # (the GitHub mirror was archived 2026-02); PyPI publication is
    # unaffected.
    "telethon==1.39.0",
    # Truecaller unofficial wrapper. Used only when
    # TRUECALLER_INSTALLATION_ID env var is set.
    # 1.0.x is async; 0.1.x was removed from PyPI in 2026 so we can't
    # pin the older sync API any more. The runner calls
    # `await search_phonenumber(...)` directly — see truecaller_runner.py.
    "truecallerpy==1.0.3",
    # socid-extractor — URL → site-specific IDs (130+ methods). Used
    # in-process; fetches the URL via httpx then parses the response
    # with the upstream library.
    "socid-extractor==0.0.28",
    # ignorant (Megadose) — phone → social-presence on Instagram /
    # Snapchat / Amazon. GPL-3.0 so we invoke as a subprocess (not an
    # import) for the same "mere aggregation" reasoning as PhoneInfoga.
    "ignorant==1.2",
    # GHunt — AGPL-3.0 email→Google profile resolver. Subprocess-only
    # (AGPL §13 network clause never triggers because we don't modify
    # GHunt). Env-conditional: needs GHUNT_CREDS_PATH set + the file
    # actually present (one-time `ghunt login` flow per RUNBOOK).
    "ghunt==2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
